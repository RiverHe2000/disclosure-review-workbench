[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-workbench"
version = "0.1.0"
description = "Local, evidence-linked review of Australian bank disclosures"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "python-multipart>=0.0.9", "pdfplumber>=0.11,<1", "pypdfium2>=4,<6", "httpx>=0.27,<1"]

[project.optional-dependencies]
model = ["torch>=2.4", "transformers>=4.45,<6", "accelerate>=1"]
dev = ["pytest>=8", "ruff>=0.12", "playwright>=1.45", "pypdfium2>=4"]

[project.scripts]
disclosure = "disclosure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
